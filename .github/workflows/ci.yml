name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-admin-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only values for a database that exists only inside this job.
      PGHOST: localhost
      PGPASSWORD: ci-admin-only
      TEST_DATABASE_URL: postgres://diyalo_migrator:ci-migrator@localhost:5432/diyalo_test
      TEST_APP_DATABASE_URL: postgres://diyalo_app:ci-app@localhost:5432/diyalo_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Create database roles and a throwaway test database
        run: |
          psql -U postgres -v ON_ERROR_STOP=1 -v migrator_pw="'ci-migrator'" -v app_pw="'ci-app'" -f db/roles.sql
          psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE diyalo_test OWNER diyalo_migrator"
      - name: Migration files match the schema (no drift)
        run: pnpm db:check && pnpm exec drizzle-kit generate --name=ci_drift_probe | tee /tmp/drift.txt && grep -q "nothing to migrate" /tmp/drift.txt
      - name: Integration tests (migrate from zero, roles, RBAC, audit)
        run: pnpm test:integration

      - run: pnpm build
        env:
          APP_ENV: development

  secrets-and-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact --verbose
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (high and critical)
        run: pnpm audit --prod --audit-level high
